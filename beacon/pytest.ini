[pytest]
# ../data-adapters/src is needed because beacon/src/beacon/__main__.py
# imports adapters.storage (get_connection, get_setting, record_audit_event,
# beacon_status helpers — see data-adapters/src/adapters/storage.py). The
# production entry point (beacon/__main__.py) already adds this to
# sys.path itself; tests import beacon's submodules directly, so it's
# added here instead — same reasoning as actions/pytest.ini.
pythonpath = src ../data-adapters/src
