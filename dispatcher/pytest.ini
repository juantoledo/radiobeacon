[pytest]
# ../data-adapters/src is needed because dispatcher/src/dispatcher/{watcher,policy,override}.py
# import adapters.storage.record_audit_event — the shared audit_log writer
# (see data-adapters/src/adapters/storage.py). Production entry points
# (dispatcher/__main__.py, dispatcher/policies.py, dispatcher/override_item.py)
# already add this to sys.path themselves before importing dispatcher's
# submodules; tests import those submodules directly, so it's added here instead.
pythonpath = src ../data-adapters/src
