# The `dispatcher` package (dispatcher/src/dispatcher/) is imported by ui/
# (`dispatcher.mq_publisher`, `dispatcher.override`, `dispatcher.watcher`) and
# by the two CLI wrappers here. Packaging it lets those depend on it with
# `-e ../dispatcher` instead of hand-inserting `dispatcher/src` onto sys.path.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radiobeacon-dispatcher"
version = "0.5.0"
description = "New-item watcher + handler delivery for radiobeacon"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt",
    "cloudevents>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
