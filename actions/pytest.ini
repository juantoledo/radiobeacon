[pytest]
# ../data-adapters/src is needed because actions/src/actions/__main__.py
# imports adapters.storage (get_connection, record_audit_event — the
# shared audit_log writer, see data-adapters/src/adapters/storage.py).
# The production entry point (actions/__main__.py) already adds this to
# sys.path itself; tests import actions' submodules directly, so it's
# added here instead.
pythonpath = src ../data-adapters/src
