services:
  ui:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    container_name: radiobeacon-ui
    restart: unless-stopped
    ports:
      # Published on all host interfaces so it's reachable from the LAN
      # (e.g. 192.168.200.145:8080). This module still has no auth of its
      # own (see ui/README.md) — only do this on a trusted network.
      - "8080:8080"
    environment:
      # UI_HOST defaults to 0.0.0.0 and UI_ALLOWED_HOSTS to "*" (see
      # ui/src/ui/config.py) — the ports: mapping above is what actually
      # controls host-side access. Set UI_ALLOWED_HOSTS to the exact
      # name/IP you browse to if you want the Host guard back (a Host not
      # listed then gets a 400).
      - UI_DB_PATH=/app/storage/radiobeacon.db
    env_file:
      - ../.env
    volumes:
      # Read-write, and a directory (not a single-file) bind mount: the
      # UI's override/rearm/policy actions write to radiobeacon.db, and
      # WAL mode needs to create -wal/-shm sidecar files next to it in
      # the same directory.
      - ../storage:/app/storage
