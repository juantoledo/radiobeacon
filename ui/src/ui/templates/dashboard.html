{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Dashboard</h1>
  {% if refresh_seconds %}
  <span class="live-badge">
    <span class="pulse-dot" aria-hidden="true"></span>
    Live · <span id="refresh-status">updated just now</span>
  </span>
  {% endif %}
</div>

{% include "_dashboard_live.html" %}
{% endblock %}
{% block scripts %}
{% if refresh_seconds %}
<script src="/static/dashboard-refresh.js" defer data-interval-ms="{{ refresh_seconds * 1000 }}"></script>
{% endif %}
{% endblock %}
