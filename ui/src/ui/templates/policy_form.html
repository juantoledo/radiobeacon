{% extends "base.html" %}
{% block title %}{% if mode == "edit" %}Edit policy{% else %}New policy{% endif %}{% endblock %}
{% block content %}
{% include "_config_nav.html" %}
<a class="crumb" href="/config/policies">&larr; Back to policies</a>
<div class="page-header"><h1>{% if mode == "edit" %}Edit policy{% else %}New policy{% endif %}</h1></div>

<form method="post" action="/config/policies">
  <table class="form-table">
    <tr>
      <th><label for="name">Name</label></th>
      <td>
        <input id="name" name="name" type="text" required
               value="{{ policy[0] if policy else '' }}"
               {% if mode == "edit" %}readonly{% endif %}>
      </td>
    </tr>
    <tr>
      <th><label for="repeat_times">repeat_times</label></th>
      <td><input id="repeat_times" name="repeat_times" type="number" min="1" required
                 value="{{ policy[1] if policy else 1 }}"></td>
    </tr>
    <tr>
      <th><label for="interval_seconds">interval_seconds</label></th>
      <td><input id="interval_seconds" name="interval_seconds" type="number" min="0" required
                 value="{{ policy[2] if policy else 0 }}"></td>
    </tr>
    <tr>
      <th><label for="description">Description</label></th>
      <td><input id="description" name="description" type="text"
                 value="{{ policy[3] if policy and policy[3] else '' }}"></td>
    </tr>
  </table>
  <button type="submit">Save</button>
</form>
{% endblock %}
