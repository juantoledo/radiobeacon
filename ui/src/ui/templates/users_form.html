{% extends "base.html" %}
{% block title %}{{ t('users.new_user') }}{% endblock %}
{% block content %}
<a class="crumb" href="/users">&larr; {{ t('users.title') }}</a>
<div class="page-header"><h1>{{ t('users.new_user') }}</h1></div>

{% if error %}
<p class="banner-warn">⚠ {{ error }}</p>
{% endif %}

<form method="post" action="/users">
  {{ csrf_field() }}
  <table class="form-table">
    <tr>
      <th><label for="username">{{ t('users.username_label') }}</label></th>
      <td><input id="username" name="username" type="text" required value="{{ username }}"></td>
    </tr>
    <tr>
      <th><label for="role">{{ t('users.role_label') }}</label></th>
      <td>
        <select id="role" name="role">
          <option value="user" {% if role == 'user' %}selected{% endif %}>{{ t('users.role_user') }}</option>
          <option value="admin" {% if role == 'admin' %}selected{% endif %}>{{ t('users.role_admin') }}</option>
        </select>
      </td>
    </tr>
    <tr>
      <th><label for="password">{{ t('users.password_label') }}</label></th>
      <td><input id="password" name="password" type="password" required autocomplete="new-password"></td>
    </tr>
    <tr>
      <th><label for="confirm_password">{{ t('users.confirm_password_label') }}</label></th>
      <td><input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password"></td>
    </tr>
  </table>
  <button type="submit">{{ t('users.create_button') }}</button>
</form>
{% endblock %}
