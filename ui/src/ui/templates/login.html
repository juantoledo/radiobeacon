{% import "_operator_credit.html" as opcredit %}<!doctype html>
<html lang="{{ locale() }}"{% if theme() != 'system' %} data-theme="{{ theme() }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ t('auth.login_title') }} · radiobeacon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23d7263d'/><circle cx='12' cy='7' r='2.2' fill='white'/><path d='M8 12a5 5 0 0 1 8 0' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/><path d='M5 9a9 9 0 0 1 14 0' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' opacity='0.55'/></svg>">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">{% if logo_url() %}<img src="{{ logo_url() }}" class="brand-logo" alt="">{% else %}<span class="dot"></span>{% endif %}radiobeacon</div>
    {% if error %}
    <p class="banner-warn">⚠ {{ t('auth.invalid_credentials') }}</p>
    {% endif %}
    <form method="post" action="/login">
      {{ csrf_field() }}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="auth-field">
        <label for="username">{{ t('auth.username_label') }}</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="auth-field">
        <label for="password">{{ t('auth.password_label') }}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit">{{ t('auth.login_button') }}</button>
    </form>
    <p class="auth-credit">{{ opcredit.credit_inline() | safe }}</p>
  </div>
</body>
</html>
