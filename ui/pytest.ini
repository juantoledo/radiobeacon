[pytest]
# ../data-adapters/src and ../dispatcher/src are needed because
# ui/src/ui/{db,queries}.py and the routers import adapters.storage and
# dispatcher.* directly. Production entry points (ui/src/ui/app.py) add
# these to sys.path themselves before importing anything from ui.*; tests
# import ui's own modules directly, so it's added here instead — same
# reasoning as dispatcher/pytest.ini.
pythonpath = src ../data-adapters/src ../dispatcher/src
